#? Config file for btop v.1.4.6
# Tokyo Night Storm Theme — Matches Ghostty terminal

#* Name of a btop++/bpytop/bashtop formatted ".theme" file
color_theme = "tokyo_night_storm"

#* If the theme set background should be shown, set to False if you want terminal background transparency
theme_background = false

#* Sets if 24-bit truecolor should be used
truecolor = true

#* Set to true to force tty mode
force_tty = false

#* Layout presets
presets = "cpu:1:default,proc:0:default"

#* Vim keys for navigation (h,j,k,l,g,G)
vim_keys = true

#* Rounded corners for aesthetic
rounded_corners = true

#* Terminal synchronized output sequences
terminal_sync = true

#* Graph symbols — braille for smooth curves
graph_symbol = "braille"
graph_symbol_cpu = "braille"
graph_symbol_mem = "braille"
graph_symbol_net = "braille"

#* Graph symbol for process box
graph_symbol_proc = "default"

#* Boxes to show
shown_boxes = "cpu mem net proc"

#* Update interval
update_ms = 1000

#* Processes sorting
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_info_smaps = false
proc_left = false
proc_filter_kernel = false
proc_aggregate = false
keep_dead_proc_usage = false

#* CPU settings
cpu_graph_upper = "Auto"
cpu_graph_lower = "Auto"
cpu_invert_lower = false
cpu_single_graph = false
cpu_bottom = false
show_uptime = true
show_cpu_watts = true
check_temp = true
cpu_sensor = "Auto"
show_coretemp = true
cpu_core_map = ""
temp_scale = "celsius"
show_cpu_freq = true

#* Clock at top
clock_format = "%X"

#* Background update
background_update = true
custom_cpu_name = ""

#* Disk settings
disks_filter = ""
mem_graphs = true
mem_below_net = false
zfs_arc_cached = true
show_swap = true
swap_disk = true
show_disks = true
only_physical = true
use_fstab = true
zfs_hide_datasets = false
disk_free_priv = false
show_io_stat = true
io_mode = false
io_graph_combined = false
io_graph_speeds = ""

#* Network settings
net_download = 100
net_upload = 100
net_auto = true
net_sync = true
net_iface = "auto"
base_10_bitrate = "Auto"

#* Battery settings
show_battery = true
selected_battery = "Auto"
show_battery_watts = true

#* Logging
log_level = "WARNING"

#* Save config on exit
save_config_on_exit = true

# Base 10 sizes
base_10_sizes = false
